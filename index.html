<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataExpert.io: Databricks AI Bootcamp — Prereqs for the Lakebase Ticketing App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f1a;
    --panel:#111726;
    --panel-alt:#161e33;
    --border:#263251;
    --border-soft:#1b2440;
    --text:#e7ecf5;
    --text-muted:#8b96b3;
    --text-dim:#5a6684;
    --amber:#f0a94e;
    --amber-dim:#8a6534;
    --teal:#57d9c6;
    --rose:#f0616d;
    --mono:'IBM Plex Mono', monospace;
    --sans:'IBM Plex Sans', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{display:flex;min-height:100vh;}
  ::selection{background:var(--amber);color:#1a1300;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--amber-dim);}
  a{color:var(--teal);}

  #sidebar{
    width:288px;flex:0 0 288px;background:var(--panel);border-right:1px solid var(--border-soft);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  }
  .brand{padding:22px 20px 16px;border-bottom:1px solid var(--border-soft);}
  .brand-mark{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--amber);}
  .brand-mark span{color:var(--text-dim);}
  .brand-sub{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-top:4px;letter-spacing:.03em;}

  #nav{flex:1;overflow-y:auto;padding:10px 10px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent;margin-bottom:2px;transition:background .12s, border-color .12s;}
  .nav-item:hover{background:var(--panel-alt);}
  .nav-item.active{background:var(--panel-alt);border-color:var(--border);}
  .nav-num{font-family:var(--mono);font-size:11px;color:var(--text-dim);width:20px;flex:0 0 20px;}
  .nav-item.active .nav-num{color:var(--amber);}
  .nav-label{font-family:var(--mono);font-size:12.5px;color:var(--text-muted);flex:1;line-height:1.3;}
  .nav-item.active .nav-label{color:var(--text);}
  .nav-status{font-size:13px;flex:0 0 14px;text-align:center;}
  .status-done{color:var(--teal);}
  .status-partial{color:var(--amber);}
  .status-none{color:var(--text-dim);}

  #sidebar-footer{padding:16px 20px;border-top:1px solid var(--border-soft);}
  .progress-label{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);display:flex;justify-content:space-between;margin-bottom:6px;letter-spacing:.03em;}
  .progress-track{height:6px;border-radius:3px;background:var(--border-soft);overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--amber-dim),var(--amber));transition:width .3s ease;}
  .reset-btn{margin-top:12px;font-family:var(--mono);font-size:10.5px;color:var(--text-dim);background:none;border:1px solid var(--border-soft);border-radius:4px;padding:6px 10px;cursor:pointer;width:100%;}
  .reset-btn:hover{color:var(--rose);border-color:var(--rose);}

  .social-row{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border-soft);}
  .social-link{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--mono);font-size:10.5px;color:var(--text-dim);text-decoration:none;border:1px solid var(--border-soft);border-radius:4px;padding:7px 8px;transition:color .12s, border-color .12s;}
  .social-link:hover{color:var(--amber);border-color:var(--amber-dim);}
  .social-link svg{width:13px;height:13px;flex:0 0 auto;}
  .made-by{margin-top:12px;font-family:var(--mono);font-size:10px;color:var(--text-dim);text-align:center;letter-spacing:.02em;}
  .made-by a{color:var(--text-dim);text-decoration:none;border-bottom:1px dotted var(--text-dim);}
  .made-by a:hover{color:var(--amber);border-color:var(--amber-dim);}

  #main{flex:1;min-width:0;padding:36px 48px 80px;max-width:980px;}
  .eyebrow{font-family:var(--mono);font-size:11.5px;color:var(--amber);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;}
  h1{font-family:var(--mono);font-size:28px;font-weight:700;margin:0 0 14px;letter-spacing:-.01em;}
  .lede{font-size:15.5px;color:var(--text-muted);line-height:1.65;max-width:700px;margin-bottom:20px;}
  .section-title{font-family:var(--mono);font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin:34px 0 14px;border-bottom:1px solid var(--border-soft);padding-bottom:8px;display:flex;align-items:center;gap:10px;}
  .section-title .count{color:var(--text-dim);font-weight:400;text-transform:none;letter-spacing:0;}

  .roadmap-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .roadmap-card{background:var(--panel);border:1px solid var(--border-soft);border-left:3px solid var(--border);border-radius:6px;padding:14px 16px;cursor:pointer;transition:border-color .12s, transform .12s;}
  .roadmap-card:hover{border-left-color:var(--amber);transform:translateX(2px);}
  .roadmap-card .rc-num{font-family:var(--mono);font-size:11px;color:var(--text-dim);}
  .roadmap-card .rc-title{font-family:var(--mono);font-size:13.5px;color:var(--text);margin-top:4px;}
  .roadmap-card .rc-desc{font-size:12.5px;color:var(--text-muted);margin-top:6px;line-height:1.5;}

  .callout{background:var(--panel-alt);border:1px solid var(--border-soft);border-radius:6px;padding:16px 18px;font-size:13.5px;color:var(--text-muted);line-height:1.6;margin:20px 0;}
  .callout b{color:var(--text);}
  .callout code, p code, li code, .lesson-body code{font-family:var(--mono);background:var(--bg);border:1px solid var(--border-soft);border-radius:4px;padding:1px 6px;font-size:12.5px;color:var(--teal);}

  /* ---- lesson content ---- */
  .lesson-wrap{margin-bottom:8px;}
  .lesson-section{margin-bottom:26px;}
  .lesson-h{font-family:var(--mono);font-size:14.5px;color:var(--amber);margin-bottom:10px;display:flex;align-items:baseline;gap:8px;}
  .lesson-h .lh-num{color:var(--text-dim);font-size:12px;}
  .lesson-body p{font-size:14px;line-height:1.72;color:var(--text-muted);margin:0 0 10px;max-width:720px;}
  .lesson-body p b{color:var(--text);}
  .lesson-code{font-family:var(--mono);font-size:12.5px;background:var(--bg);border:1px solid var(--border-soft);border-radius:6px;padding:12px 16px;margin:10px 0;color:var(--teal);white-space:pre-wrap;line-height:1.6;max-width:720px;}
  .lesson-note{font-family:var(--mono);font-size:12.5px;background:var(--bg);border:1px dashed var(--border);border-radius:6px;padding:10px 14px;margin:8px 0 10px;color:var(--text-dim);white-space:pre-wrap;line-height:1.6;max-width:720px;}
  .ex-table-wrap{margin:10px 0 14px;overflow-x:auto;}
  table.ex-table{border-collapse:collapse;font-family:var(--mono);font-size:12px;}
  table.ex-table th{background:var(--panel-alt);color:var(--amber);text-align:left;padding:7px 12px;border:1px solid var(--border-soft);white-space:nowrap;}
  table.ex-table td{padding:7px 12px;border:1px solid var(--border-soft);color:var(--text-muted);white-space:nowrap;}
  .diagram-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:12px 0;}
  .diag-box{font-family:var(--mono);font-size:12px;border:1px solid var(--border);border-radius:6px;padding:10px 14px;background:var(--panel-alt);}
  .diag-box .db-title{color:var(--amber);margin-bottom:4px;}
  .diag-box .db-row{color:var(--text-dim);}
  .diag-arrow{font-family:var(--mono);color:var(--text-dim);font-size:18px;}

  .begin-quiz-btn{margin:18px 0 8px;}

  /* quiz */
  .quiz-intro{font-size:14px;color:var(--text-muted);line-height:1.6;margin-bottom:20px;max-width:700px;}
  .q-card{background:var(--panel);border:1px solid var(--border-soft);border-radius:8px;padding:20px 22px;margin-bottom:16px;}
  .q-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;}
  .q-text{font-size:15px;line-height:1.55;color:var(--text);}
  .q-tag{font-family:var(--mono);font-size:10px;color:var(--text-dim);border:1px solid var(--border-soft);border-radius:4px;padding:2px 7px;white-space:nowrap;flex:0 0 auto;}
  .q-code{font-family:var(--mono);font-size:12.5px;background:var(--bg);border:1px solid var(--border-soft);border-radius:6px;padding:10px 14px;margin:10px 0;color:var(--teal);white-space:pre-wrap;line-height:1.5;}
  .opt-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .opt{text-align:left;background:var(--panel-alt);border:1px solid var(--border-soft);border-radius:6px;padding:10px 14px;font-size:13.5px;color:var(--text);cursor:pointer;font-family:var(--sans);}
  .opt:hover:not(.locked){border-color:var(--amber-dim);}
  .opt.correct{border-color:var(--teal);background:rgba(87,217,198,.08);color:var(--teal);}
  .opt.wrong{border-color:var(--rose);background:rgba(240,97,109,.08);color:var(--rose);}
  .opt.locked{cursor:default;opacity:.75;}
  .opt.locked.dim{opacity:.4;}
  .fill-row{display:flex;gap:8px;margin-top:10px;}
  .fill-row input{flex:1;background:var(--bg);border:1px solid var(--border-soft);border-radius:6px;color:var(--text);font-family:var(--mono);font-size:13.5px;padding:9px 12px;}
  .fill-row input:focus{outline:none;border-color:var(--amber-dim);}
  .btn{font-family:var(--mono);font-size:12.5px;background:var(--amber);color:#1a1300;border:none;border-radius:6px;padding:9px 16px;cursor:pointer;font-weight:600;white-space:nowrap;}
  .btn:hover{background:#f5b968;}
  .btn.secondary{background:none;border:1px solid var(--border-soft);color:var(--text-muted);}
  .btn.secondary:hover{border-color:var(--text-dim);color:var(--text);}
  .explain{margin-top:12px;font-size:13px;line-height:1.55;color:var(--text-muted);border-top:1px solid var(--border-soft);padding-top:12px;}
  .explain b{color:var(--teal);}
  .explain.wrong-explain b{color:var(--rose);}

  .sql-layout{display:grid;grid-template-columns:230px 1fr;gap:18px;margin-top:10px;}
  .sql-ex-list{display:flex;flex-direction:column;gap:4px;}
  .sql-ex-item{font-family:var(--mono);font-size:12px;padding:9px 10px;border-radius:6px;border:1px solid transparent;cursor:pointer;color:var(--text-muted);display:flex;gap:8px;align-items:flex-start;}
  .sql-ex-item:hover{background:var(--panel-alt);}
  .sql-ex-item.active{background:var(--panel-alt);border-color:var(--border);color:var(--text);}
  .schema-box{margin-top:16px;background:var(--panel);border:1px solid var(--border-soft);border-radius:6px;padding:12px 14px;}
  .schema-box h4{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin:0 0 8px;text-transform:uppercase;letter-spacing:.05em;}
  .schema-table{font-family:var(--mono);font-size:11px;color:var(--text-muted);margin-bottom:10px;}
  .schema-table .tname{color:var(--amber);}
  .schema-table .col{color:var(--text-dim);padding-left:8px;}
  .schema-table .pk{color:var(--teal);}

  .concept-box{background:var(--panel);border:1px solid var(--border-soft);border-left:3px solid var(--amber-dim);border-radius:6px;padding:14px 16px;margin-bottom:14px;}
  .concept-box .cb-title{font-family:var(--mono);font-size:12px;color:var(--amber);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  .concept-box p{font-size:13.5px;line-height:1.6;color:var(--text-muted);margin:0 0 8px;}
  .concept-box code{font-family:var(--mono);background:var(--bg);border:1px solid var(--border-soft);border-radius:4px;padding:1px 6px;font-size:12.5px;color:var(--teal);}

  .terminal{background:#080b13;border:1px solid var(--border-soft);border-radius:8px;overflow:hidden;}
  .term-top{background:var(--panel-alt);padding:8px 14px;font-family:var(--mono);font-size:11px;color:var(--text-dim);border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;}
  .term-body{padding:16px;}
  .prompt-line{font-family:var(--mono);font-size:12.5px;color:var(--teal);margin-bottom:6px;}
  textarea#sql-input{width:100%;min-height:90px;background:transparent;border:none;color:var(--text);font-family:var(--mono);font-size:13.5px;resize:vertical;outline:none;line-height:1.5;}
  .term-actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .term-hint{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);}
  .result-area{margin-top:14px;border-top:1px solid var(--border-soft);padding-top:14px;}
  .result-msg{font-family:var(--mono);font-size:12.5px;margin-bottom:10px;}
  .result-msg.ok{color:var(--teal);}
  .result-msg.err{color:var(--rose);}
  .result-msg.pending{color:var(--text-dim);}
  table.res-table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;}
  table.res-table th{background:var(--panel-alt);color:var(--amber);text-align:left;padding:6px 10px;border:1px solid var(--border-soft);}
  table.res-table td{padding:6px 10px;border:1px solid var(--border-soft);color:var(--text-muted);}
  .ex-prompt{font-size:13.5px;color:var(--text);line-height:1.55;margin-bottom:10px;}
  .ex-hint-box{margin-top:10px;font-size:12.5px;color:var(--text-muted);}
  .loading-wrap{padding:60px 0;text-align:center;font-family:var(--mono);color:var(--text-dim);font-size:13px;}
  .score-badge{font-family:var(--mono);font-size:11px;color:var(--text-dim);}
  .score-badge b{color:var(--amber);}

  @media (max-width: 900px){
    body{flex-direction:column;}
    #sidebar{position:relative;width:100%;height:auto;flex:none;}
    #main{padding:24px 20px 60px;}
    .roadmap-grid{grid-template-columns:1fr;}
    .sql-layout{grid-template-columns:1fr;}
  }
</style>
</head>

<script>
/* =========================================================================
   DATA: modules, lessons, quiz questions, sql exercises
   ========================================================================= */

const MODULES = [
  { id:'m0', num:'00', title:'Roadmap', kind:'intro' },
  { id:'m1', num:'01', title:'Relational DB & SQL', kind:'quiz' },
  { id:'m2', num:'02', title:'SQL Console (hands-on)', kind:'sql' },
  { id:'m3', num:'03', title:'Python Fundamentals', kind:'quiz' },
  { id:'m4', num:'04', title:'HTTP & APIs', kind:'quiz' },
  { id:'m5', num:'05', title:'FastAPI & Backends', kind:'quiz' },
  { id:'m6', num:'06', title:'DB Connections & Safety', kind:'quiz' },
  { id:'m7', num:'07', title:'Frontend Basics', kind:'quiz' },
  { id:'m8', num:'08', title:'Secrets, Git & Packaging', kind:'quiz' },
  { id:'m9', num:'09', title:'Databricks & Lakebase', kind:'quiz' },
];

/* ---------------- LESSONS ---------------- */
const LESSONS = {
m1: [
  { h:"What is a database, actually?",
    p:[
      "Strip away the jargon: a database is just a place that stores information reliably, so many people or programs can read and write it at the same time without stepping on each other.",
      "Compare it to a spreadsheet emailed around a team — anyone can overwrite anyone else's changes, and there's no single 'truth'. A database is instead an always-on service that everyone talks to directly. It enforces rules about what can be stored (a status can't be a random typo, a ticket can't disappear mid-update) and guarantees that once something is saved, it stays saved."
    ]},
  { h:"How do you recognize a table?",
    p:[
      "Say someone hands you this pile of information about support tickets, completely unstructured:",
    ],
    note:"\"Login page throws 500 error, opened by grace.liu, status open, opened July 1.\"\n\"omar.said asked for a dark mode toggle, this one's in progress.\"\n\"CSV export bug, reported by grace.liu on June 28th, already resolved.\"",
    p2:[
      "That's readable by a human, but useless to a program — every entry describes different fields in a different order. A <b>table</b> fixes this by forcing every record into the exact same shape: the same columns, in the same order, for every single row. Here's that same information turned into a table:"
    ],
    table:{cols:["ticket_id","title","status","created_by","created_at"],
      rows:[["1","Login page throws 500 error","open","grace.liu","2026-07-01"],
            ["2","Add dark mode toggle","in_progress","omar.said","2026-07-02"],
            ["3","Export to CSV missing headers","resolved","grace.liu","2026-06-28"]]},
    p3:[
      "Two things tell you you're looking at a table: <b>(1)</b> every row has exactly the same columns — you'll never find a row with an extra or missing field, and <b>(2)</b> each column holds one consistent kind of value all the way down — <code>status</code> is always a short status word, <code>created_at</code> is always a date. If data doesn't have that regularity yet, it isn't a table — it still needs to be modeled into one."
    ]},
  { h:"Rows and columns",
    p:[
      "A <b>row</b> is one record — one specific ticket. A <b>column</b> is one attribute that every row shares — every ticket has a title, so <code>title</code> is a column; every ticket has a status, so <code>status</code> is a column.",
      "Read the table above sideways: reading across a row gives you everything about one ticket. Reading down a column gives you the same single fact (e.g. every ticket's status) across all tickets. That second view is exactly what a query like 'show me all open tickets' needs."
    ]},
  { h:"Primary keys — the ID that's never repeated",
    p:[
      "Notice <code>ticket_id</code> in the table: 1, 2, 3. Two tickets could easily have the same title ('Bug report') or the same status ('open') — but no two rows are ever allowed to share the same <code>ticket_id</code>, and it can never be empty.",
      "That column is the table's <b>primary key</b>: a value that uniquely identifies one specific row, and only that row. It's what lets you say 'update ticket 3' and know with certainty exactly which record you mean, even if ten other tickets have a similar title."
    ]},
  { h:"Foreign keys — how two tables reference each other",
    p:[
      "Your homework has a second table, <code>ticket_messages</code>, holding the conversation on each ticket. Instead of copying a ticket's full title into every message row (wasteful, and it'd go stale if the title changed), each message just stores which ticket it belongs to — its <code>ticket_id</code>."
    ],
    diagram:{
      left:{title:"tickets", rows:["ticket_id (PK)","title","status"]},
      right:{title:"ticket_messages", rows:["message_id (PK)","ticket_id (FK)","message_text"]}

function execToRows(execResult){
  if(!execResult || execResult.length===0) return {columns:[],rows:[]};
  const r = execResult[0];
  return { columns:r.columns, rows:r.values };
}

const SQL_EXERCISES = [
  { id:'e1', title:'Select all tickets',
    concept:"SELECT * FROM table_name; means 'give me every column, for every row, with no filtering.' The asterisk (*) is shorthand for 'all columns' — you'll use this to sanity-check a table's contents before narrowing down.",
    prompt:"Write a query that returns every column for every row in the tickets table.",
    hint:"SELECT * FROM tickets;",
    check(db){
      try{
        const {columns, rows} = execToRows(db.exec(window.__lastUserSQL));
        return columns.includes('ticket_id') && columns.includes('status') && rows.length===4;
      }catch(e){ return false; }
    }
  },
  { id:'e2', title:'Filter by status',
    concept:"WHERE column = 'value' keeps only rows where that condition is true. Text values go in single quotes. This is how your app will implement 'filter tickets by status'.",
    prompt:"Write a query that returns only tickets where status = 'open'. There should be exactly 2.",
    hint:"SELECT * FROM tickets WHERE status='open';",
    check(db){
      try{
        const {columns, rows} = execToRows(db.exec(window.__lastUserSQL));
        const statusIdx = columns.indexOf('status');
        if(statusIdx===-1 || rows.length!==2) return false;
        return rows.every(r => r[statusIdx]==='open');
      }catch(e){ return false; }
    }
  },
  { id:'e3', title:'Sort by newest first',
    concept:"ORDER BY column DESC sorts rows by that column, largest/latest first. ASC (the default) sorts smallest/earliest first. Dates sort correctly this way because they're stored as comparable text/timestamp values.",
    prompt:"Return all tickets ordered so the most recently created ticket appears first.",
    hint:"SELECT * FROM tickets ORDER BY created_at DESC;",
    check(db){
      try{
        const {columns, rows} = execToRows(db.exec(window.__lastUserSQL));
        const idx = columns.indexOf('created_at');
        if(idx===-1 || rows.length<2) return false;
        return rows[0][idx] === '2026-07-05 08:47:00';
      }catch(e){ return false; }
    }
  },
  { id:'e4', title:'Count messages per ticket',
    concept:"GROUP BY column collapses rows sharing the same value in that column into one summary row per group — usually paired with an aggregate like COUNT(*), SUM(), or AVG(). Here, grouping ticket_messages by ticket_id gives you one row per ticket, with a count of its messages.",
    prompt:"Return each ticket_id from ticket_messages alongside a count of how many messages it has.",
    hint:"SELECT ticket_id, COUNT(*) FROM ticket_messages GROUP BY ticket_id;",
    check(db){
      try{
        const {columns, rows} = execToRows(db.exec(window.__lastUserSQL));
        if(rows.length!==4) return false;
        const tIdx = columns.findIndex(c=>c.toLowerCase().includes('ticket_id'));
        const cIdx = columns.findIndex(c=> c!==columns[tIdx]);
        if(tIdx===-1||cIdx===-1) return false;
        return rows.every(r => Number(r[cIdx])===2);
      }catch(e){ return false; }
    }
  },
  { id:'e5', title:'Join tickets with their messages',
    concept:"JOIN table_b ON table_a.key = table_b.key stitches rows from two tables together wherever the key columns match. Every message row gets paired with its ticket row, so you can pull columns from both in one query.",
    prompt:"Return each ticket's title alongside the message_text of its messages, joining the two tables. You should get 8 rows.",
    hint:"SELECT tickets.title, ticket_messages.message_text\nFROM tickets\nJOIN ticket_messages ON tickets.ticket_id = ticket_messages.ticket_id;",
    check(db){
      try{
        const {columns, rows} = execToRows(db.exec(window.__lastUserSQL));
        return rows.length===8 && columns.length>=2;
      }catch(e){ return false; }
    }
  },
  { id:'e6', title:'Insert a new ticket',
    concept:"INSERT INTO table VALUES (...) adds a new row. Values must be given in the exact same order as the table's columns were defined, and text values need quotes.",
    prompt:"Insert a 5th ticket with ticket_id=5, any title, status='open', created_by='you', created_at='2026-08-07 10:00:00'.",
    hint:"INSERT INTO tickets VALUES (5,'New issue title','open','you','2026-08-07 10:00:00');",
    check(db){
      try{
        db.exec(window.__lastUserSQL);
        const {rows} = execToRows(db.exec("SELECT * FROM tickets WHERE ticket_id=5"));
        return rows.length===1;
      }catch(e){ return false; }
    }
  },
  { id:'e7', title:"Update a ticket's status",
    concept:"UPDATE table SET column = value WHERE condition changes existing rows matching the condition. Leaving off the WHERE clause would update every single row in the table — always double-check it before running an UPDATE.",
    prompt:"Update ticket_id=4 so its status becomes 'resolved'.",
    hint:"UPDATE tickets SET status='resolved' WHERE ticket_id=4;",
    check(db){
      try{
        db.exec(window.__lastUserSQL);
        const {columns, rows} = execToRows(db.exec("SELECT status FROM tickets WHERE ticket_id=4"));
        return rows.length===1 && rows[0][columns.indexOf('status')]==='resolved';
      }catch(e){ return false; }
    }
  },
  { id:'e8', title:'Add a message to an existing ticket',
    concept:"Same INSERT pattern as before, applied to the child table — this is what your app's 'add message' feature does under the hood, once a ticket already exists.",
    prompt:"Insert a new message (message_id=9) into ticket_messages for ticket_id=2, with any message_text, author='you', created_at='2026-08-07 10:05:00'.",
    hint:"INSERT INTO ticket_messages VALUES (9,2,'Following up on this.','you','2026-08-07 10:05:00');",
    check(db){
      try{
        db.exec(window.__lastUserSQL);
        const {rows} = execToRows(db.exec("SELECT * FROM ticket_messages WHERE ticket_id=2"));
        return rows.length===3;
      }catch(e){ return false; }
    }
  },
];

function moduleStatus(mod){
  if(mod.kind==='intro') return 'none';
  if(mod.kind==='quiz'){
    const p = state.quizProgress[mod.id];
    const total = QUIZZES[mod.id].questions.length;
    if(p.answered.size===0) return 'none';
    if(p.answered.size<total) return 'partial';
    return 'done';
  }
  if(mod.kind==='sql'){
    if(state.sqlProgress.completed.size===0) return 'none';
    if(state.sqlProgress.completed.size<SQL_EXERCISES.length) return 'partial';
    return 'done';
  }
}

function renderSidebar(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  MODULES.forEach(mod=>{
    const item = document.createElement('div');
    item.className = 'nav-item' + (state.active===mod.id ? ' active':'');
    const status = moduleStatus(mod);
    const statusChar = status==='done' ? '●' : status==='partial' ? '◐' : '○';
    const statusClass = status==='done' ? 'status-done' : status==='partial' ? 'status-partial' : 'status-none';
    item.innerHTML = `
      <span class="nav-num">${mod.num}</span>
      <span class="nav-label">${mod.title}</span>
      <span class="nav-status ${statusClass}">${statusChar}</span>
    `;
    item.onclick = ()=>{ state.active = mod.id; renderAll(); window.scrollTo(0,0); };
    nav.appendChild(item);
  });

  let totalQ=0, doneQ=0;
  MODULES.forEach(m=>{
    if(m.kind==='quiz'){ totalQ += QUIZZES[m.id].questions.length; doneQ += state.quizProgress[m.id].answered.size; }
    if(m.kind==='sql'){ totalQ += SQL_EXERCISES.length; doneQ += state.sqlProgress.completed.size; }
  });
  const pct = totalQ===0 ? 0 : Math.round((doneQ/totalQ)*100);
  document.getElementById('progress-pct').textContent = pct+'%';
  document.getElementById('progress-fill').style.width = pct+'%';
}

function quizHTML(mod){
  const data = QUIZZES[mod.id];
  const lessons = LESSONS[mod.id] || [];
  const started = state.quizStarted[mod.id];
  const p = state.quizProgress[mod.id];

  const lessonHtml = `
    <div class="section-title">Lesson <span class="count">— read this first</span></div>
    <div class="lesson-wrap">${renderLessonSections(lessons)}</div>
  `;

  if(!started){
    return `
      <div class="eyebrow">Module ${mod.num}</div>
      <h1>${mod.title}</h1>
      ${lessonHtml}
      <div class="begin-quiz-btn"><button class="btn" id="begin-quiz-btn">Start the quiz ▸</button></div>
    `;
  }

  const qcards = data.questions.map((q, i)=>{
    const answered = p.answered.has(i);
    const wasCorrect = p.correct.has(i);
    const tag = q.code ? '<span class="q-tag">CODE</span>' : '<span class="q-tag">CONCEPT</span>';
    let body = '';
    if(q.type==='mcq'){
      const opts = q.options.map((opt, oi)=>{
        let cls='opt';
        if(answered){
          cls+=' locked';
          if(oi===q.correct) cls+=' correct';
          else if(p.selected && p.selected[i]===oi) cls+=' wrong';
          else cls+=' dim';
        }
        return `<button class="${cls}" data-mod="${mod.id}" data-q="${i}" data-opt="${oi}" ${answered?'disabled':''}>${escapeHtml(opt)}</button>`;
      }).join('');
      body = `<div class="opt-list">${opts}</div>`;
    } else if(q.type==='fillblank'){
      body = `<div class="fill-row">
        <input type="text" id="fill-${mod.id}-${i}" placeholder="Type your answer" ${answered?'disabled':''} value="${answered&&p.selected&&p.selected[i]!==undefined?escapeHtml(p.selected[i]):''}">
        <button class="btn" data-mod="${mod.id}" data-q="${i}" data-fillcheck="1" ${answered?'disabled':''}>Check</button>
      </div>`;
    }
    const explainBlock = answered ? `<div class="explain ${wasCorrect?'':'wrong-explain'}">${wasCorrect?'<b>Correct.</b> ':'<b>Not quite.</b> '}${q.explain}</div>` : '';
    const qTextHtml = q.code ? `<div class="q-text">${escapeHtml(q.q.split('\n')[0])}</div><div class="q-code">${escapeHtml(q.q.split('\n').slice(1).join('\n'))}</div>`
                              : `<div class="q-text">${escapeHtml(q.q)}</div>`;
    return `<div class="q-card">
      <div class="q-head">${qTextHtml}${tag}</div>
      ${body}
      ${explainBlock}
    </div>`;
  }).join('');

  const scoreText = `<span class="score-badge">${p.answered.size}/${data.questions.length} answered · <b>${p.correct.size}</b> correct</span>`;

  return `
    <div class="eyebrow">Module ${mod.num}</div>
    <h1>${mod.title}</h1>
    <div class="callout" style="cursor:pointer;" id="reopen-lesson">↑ Re-read the lesson for this module</div>
    <div class="section-title">Quiz <span class="count">${scoreText}</span></div>
    ${qcards}
  `;
}

function attachQuizHandlers(mod){
  const beginBtn = document.getElementById('begin-quiz-btn');
  if(beginBtn){ beginBtn.onclick = ()=>{ state.quizStarted[mod.id]=true; renderAll(); window.scrollTo(0,0); }; }

  const reopen = document.getElementById('reopen-lesson');
  if(reopen){ reopen.onclick = ()=>{ state.quizStarted[mod.id]=false; renderAll(); window.scrollTo(0,0); }; }

  document.querySelectorAll('.opt[data-mod]').forEach(btn=>{
    btn.onclick = ()=>{
      const mId = btn.dataset.mod, qi = Number(btn.dataset.q), oi = Number(btn.dataset.opt);
      answerMcq(mId, qi, oi);
    };
  });
  document.querySelectorAll('[data-fillcheck]').forEach(btn=>{
    btn.onclick = ()=>{
      const mId = btn.dataset.mod, qi = Number(btn.dataset.q);
      const input = document.getElementById(`fill-${mId}-${qi}`);
      answerFill(mId, qi, input.value);
    };
  });
}

function answerMcq(mId, qi, oi){
  const p = state.quizProgress[mId];
  if(p.answered.has(qi)) return;
  const q = QUIZZES[mId].questions[qi];
  p.answered.add(qi);
  if(!p.selected) p.selected = {};
  p.selected[qi] = oi;
  if(oi===q.correct) p.correct.add(qi);
  renderAll();
}
function answerFill(mId, qi, value){
  const p = state.quizProgress[mId];
  if(p.answered.has(qi)) return;
  const q = QUIZZES[mId].questions[qi];
  p.answered.add(qi);
  if(!p.selected) p.selected = {};
  p.selected[qi] = value;
  const norm = (value||'').trim().toLowerCase();
  if(q.accepted.some(a=>norm.includes(a))) p.correct.add(qi);
  renderAll();
}

function attachSqlHandlers(){
  if(!state.sqlReady) return;

  document.querySelectorAll('.sql-ex-item').forEach(item=>{
    item.onclick = ()=>{
      state.sqlProgress.activeExercise = Number(item.dataset.idx);
      renderAll();
    };
  });

  const hintToggle = document.getElementById('hint-toggle');
  const hintBox = document.getElementById('hint-box');
  let hintShown = false;
  hintToggle.onclick = ()=>{
    hintShown = !hintShown;
    hintBox.style.display = hintShown ? 'block' : 'none';
    hintToggle.textContent = hintShown ? 'hide hint ▴' : 'show hint ▾';
  };

  const runBtn = document.getElementById('run-sql-btn');
  const input = document.getElementById('sql-input');
  input.addEventListener('keydown', (e)=>{
    if((e.metaKey||e.ctrlKey) && e.key==='Enter'){ e.preventDefault(); runQuery(); }
  });
  input.addEventListener('input', ()=>{
    if(!state.sqlProgress.draft) state.sqlProgress.draft = {};
    state.sqlProgress.draft[state.sqlProgress.activeExercise] = input.value;
  });
  runBtn.onclick = runQuery;

  function runQuery(){
    const sql = input.value.trim();
    const msgEl = document.getElementById('result-msg');
    const tableEl = document.getElementById('result-table');
    if(!sql){ msgEl.textContent='Write a query first.'; msgEl.className='result-msg err'; return; }
    window.__lastUserSQL = sql;
    try{
      const execResult = state.db.exec(sql);
      const {columns, rows} = execToRows(execResult);
      if(columns.length>0){
        let html = '<table class="res-table"><thead><tr>' + columns.map(c=>`<th>${escapeHtml(c)}</th>`).join('') + '</tr></thead><tbody>';
        rows.forEach(r=>{ html += '<tr>' + r.map(v=>`<td>${escapeHtml(String(v))}</td>`).join('') + '</tr>'; });
        html += '</tbody></table>';
        tableEl.innerHTML = html;
      } else {
        tableEl.innerHTML = '';
      }

      const ex = SQL_EXERCISES[state.sqlProgress.activeExercise];
      const passed = ex.check(state.db);
      if(passed){
        msgEl.textContent = '✓ Correct — this matches what the exercise is checking for.';
        msgEl.className = 'result-msg ok';
        state.sqlProgress.completed.add(state.sqlProgress.activeExercise);
        renderSidebar();
      } else {
        msgEl.textContent = columns.length>0
          ? 'Query ran, but the result doesn\'t match what this exercise is checking for yet. Try again.'
          : 'Query ran with no rows returned — check the hint if you\'re stuck.';
        msgEl.className = 'result-msg err';
      }
    }catch(err){
      tableEl.innerHTML = '';
      msgEl.textContent = 'SQL error: ' + err.message;
      msgEl.className = 'result-msg err';
    }
  }
}

}

document.getElementById('reset-btn').onclick = ()=>{
  MODULES.forEach(m=>{
    if(m.kind==='quiz'){ state.quizProgress[m.id] = { answered:new Set(), correct:new Set() }; state.quizStarted[m.id]=false; }
  });
  state.sqlProgress.completed = new Set();
  state.sqlProgress.draft = {};
  if(state.db){
    state.db.close();
    initDb();
  }
  renderAll();
};

function initDb(){
  const SQL_ = window.__SQLLIB;
  state.db = new SQL_.Database();
  state.db.run(SCHEMA_SQL);
}

renderAll();

initSqlJs({ locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${file}` })
  .then(SQL_=>{
    window.__SQLLIB = SQL_;
    initDb();
    state.sqlReady = true;
    if(state.active==='m2') renderMain();
    renderSidebar();
  })
  .catch(err=>{
    console.error('sql.js failed to load', err);
    if(state.active==='m2'){
      document.getElementById('main').innerHTML = `<div class="eyebrow">Module 02</div><h1>SQL Console</h1><div class="callout">The in-browser SQL engine failed to load (likely a network/CDN issue): ${escapeHtml(err.message||String(err))}. Try refreshing.</div>`;
    }
  });
</script>
</body>
</html>
